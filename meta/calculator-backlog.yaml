# -*- coding: yaml -*-
# GLM-built tool/reference pages (no live research needed — plan-driven, uses
# site's existing sourced data + evergreen physics/maths). 2 per shift.
- slug: skip-size-calculator
  title: "Skip bin size calculator — what size skip do I need?"
  meta_description: "Enter your junk in wheelbarrow or trailer loads; get the skip bin size in cubic metres you'll actually be told to book."
  kind: calculator
  plan: |
    Interactive skip size calculator: inputs = wheelbarrow loads, trailer loads,
    bulky item checkboxes (couch, mattress, fridge, wardrobe); output = estimated m3,
    recommended bin size (2/3/4/6/8/10m3) with headroom advice, weight warning for
    heavy waste. FAQ block targeting "what size skip do I need" long-tail.
  status: done

- slug: wheelie-bin-volume-converter
  title: "Wheelie bin litres converter: 80L vs 120L vs 240L vs 360L"
  meta_description: "Convert wheelie bin litres into wheelbarrow loads, trailer loads and junk-pile equivalents — with a printable capacity cheat sheet."
  kind: calculator
  plan: |
    Litres converter: pick bin size (80/120/240/360L) -> show wheelbarrow loads
    (standard 60L), 9x4 trailer loads (0.6m3), and junk equivalents (bin bags,
    couches). Include dimension table (typical AU wheelie bin HxWxD) and a
    'which size is my bin' visual-ID guide (lid colour/lift-bar hints).
  status: queued

- slug: trailer-loads-to-skip-calculator
  title: "Trailer loads to skip bin size calculator"
  meta_description: "How many trailer loads fit in each skip bin size? Convert your trailer trips into the right skip and see when the skip actually wins."
  kind: calculator
  plan: |
    Inputs: trailer size (6x4 = 0.6m3, 7x4 = 0.9m3, 8x5 = 1.2m3), number of level
    loads (warn heaped loads add 30-50%), waste type (general/green/heavy).
    Output: total m3, recommended skip, trips saved, and a note on when multiple
    tip runs beat one skip (heavy waste + small volumes).
  status: queued

- slug: skip-vs-tip-run-comparison
  title: "Skip bin vs tip run calculator: which is cheaper for your junk?"
  meta_description: "Compare a skip bin against DIY tip runs — fuel, trailer, time and gate fees considered. Honest maths, not marketing."
  kind: calculator
  plan: |
    Inputs: volume m3, waste type, distance to tip (km), car/trailer fuel L/100km,
    fuel price (pre-filled AU average, editable, marked indicative), your hourly
    value. Output: DIY cost estimate vs indicative skip band (grey-badge unverified),
    plus time comparison table. Heavy note: weight limits can flip the answer.
  status: queued

