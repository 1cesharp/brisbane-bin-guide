body: |
  ## Check your bin collection day
  
  Search your full street address and suburb on Brisbane City Council’s official bin collections page. This is the verified lookup tool. Enter it like 1141 Sandgate Road, Nundah. For units use unit number/street number (e.g. 6/1 Street Name, Suburb). The search shows your red (general waste), yellow (recycling) and green (garden waste) collection days.[[1]](https://www.brisbane.qld.gov.au/bins-waste-and-recycling/waste-and-recycling-bins/bin-collections)
  
  You can also download a yearly visual calendar from the same page at https://apps.impactapps.com.au/brisbane/calendar. It covers 2026 collections.[[1]](https://www.brisbane.qld.gov.au/bins-waste-and-recycling/waste-and-recycling-bins/bin-collections)
  
  Download the free Brisbane Bin and Recycling app (iOS or Android). Add your address once, then view schedules and set reminders for collection days. New addresses are added quarterly if yours does not appear. Use a nearby same-street address as a workaround.[[2]](https://www.brisbane.qld.gov.au/bins-waste-and-recycling/waste-education-programs-and-resources/brisbane-bin-and-recycling-app)
  
  Red bins are collected weekly. Yellow and green bins are collected fortnightly on alternating weeks. Days vary by street, not just suburb.[[1]](https://www.brisbane.qld.gov.au/bins-waste-and-recycling/waste-and-recycling-bins/bin-collections)
  
  ## Public holiday collections: no delays or shifts
  
  Bins are collected every day of the year, including all public holidays. There is no change to your usual day and no next-day catch-up. Put bins out as normal.[[1]](https://www.brisbane.qld.gov.au/bins-waste-and-recycling/waste-and-recycling-bins/bin-collections)
  
  This applied across the 2025–26 festive period (19 December 2025 to 6 January 2026). Red, yellow and green collections continued as scheduled, including Christmas Day, Boxing Day and New Year’s Day. Resource recovery centres also stayed open every day.[[3]](https://www.brisbane.qld.gov.au/about-council/news-and-community-updates/community-service-announcements/december-2025/impacts-to-council-services-and-facilities-over-the-festive-seas)
  
  Council reminded residents in December 2025 via Instagram (@brisbanecitycouncil, around 22 December) and Facebook that collections happen on their usual days even on public holidays. Search “rubbish collections” or use the address lookup to confirm which bin is next.[[4]](https://www.instagram.com/brisbanecitycouncil/reel/DSlqqalCT_m/)
  
  Place bins at the kerb (or as close as possible) by 5.30am on collection day. Set multiple bins at least 30 cm apart, lids closed, wheels facing the property, and clear of parked cars or paths. You can put them out up to 24 hours before; bring them in as soon as possible afterwards (no more than 24 hours). Council can investigate bins left out too long.[[1]](https://www.brisbane.qld.gov.au/bins-waste-and-recycling/waste-and-recycling-bins/bin-collections)
  
  ## What to do right now
  
  1. Open https://www.brisbane.qld.gov.au/bins-waste-and-recycling/waste-and-recycling-bins/bin-collections and search your exact address. Note your next red, yellow and green days.
  2. If a public holiday falls on your collection day, still put the correct bin(s) out the night before or by 5.30am. No extra steps needed.
  3. Install the Brisbane Bin and Recycling app and add your address for push reminders.
  4. After collection, bring bins in promptly.
  5. If a bin is missed, report it online after 4.30pm on collection day (red bins) or within 2 working days (yellow/green). Missed red bins are collected as soon as possible. Use https://services.brisbane.qld.gov.au/online-services/report-an-issue/bin-problem or call 07 3403 8888.[[1]](https://www.brisbane.qld.gov.au/bins-waste-and-recycling/waste-and-recycling-bins/bin-collections)
  
  Check the council page again closer to major holidays such as King’s Birthday or Christmas for any operational notes, though the standard rule is collections continue unchanged.
  
