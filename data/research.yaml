why_expensive: |
  Skip bin hire looks like "paying for a big steel box", so the price feels inflated.
  In reality six costs stack up:

  1. **Landfill disposal is charged by weight.** The hire covers delivery and pickup;
     disposal is metered at the tip gate. Queensland landfill levies make the per-tonne
     gate fee a large share of the total [1].
  2. **Weight, not volume, is the cliff.** Bins have tonne allowances; concrete, soil
     and tile loads blow through them quickly. Heavy-waste bins cost more than
     general-waste bins of the same size [2].
  3. **Levies differ by council area and facility.** Where your junk is weighed and
     dumped changes the gate price, which is why identical bins can differ across a
     council border [1].
  4. **Fuel and truck time.** One delivery + one pickup trip per job, with urban
     congestion pricing in the labour.
  5. **Permits.** If the bin sits on the street or nature strip, the council charges
     a permit fee on top — Brisbane included [3].
  6. **Demand spikes.** Pre-Christmas and pre-storm-season weeks see prices firm up.

  **How to pay less:** sort heavy material out of general waste, pick the smallest
  bin you can realistically fill (overfilling = over-weight charges), keep the bin
  on your own property to skip the permit, and compare at least two providers.

  ### Source register
  1. [Queensland waste levy — Business Queensland](https://www.business.qld.gov.au/running-business/environment/waste-management/waste-levy)
  2. [Skip bin waste types explained](/research/skip-vs-junk-removal.html)
  3. [Brisbane City Council skip bin permits](https://www.brisbane.qld.gov.au/planning-and-building/building-and-renovating/skip-bins)

skip_vs_removal: |
  Two ways to clear junk: a **skip bin** you fill yourself, or a **junk removal crew**
  that loads and takes it away the same visit.

  | | Skip bin | Junk removal service |
  |---|---|---|
  | You do the loading | Yes | No — crew loads |
  | Typical cost driver | Size (m³) + waste type | Volume of items + labour time |
  | Best for | Renovations, gradual cleanups, heavy loads staged over days | Single-room cleanouts, furniture, same-day urgency |
  | Timing | Bin sits for days (hire period) | One visit, usually 1–2 hours |
  | Heavy material | Fine (within weight limits) | Often priced at premium |
  | Space needed | Driveway or (permitted) street spot | Just a truck park |

  **Rule of thumb:** junk removal wins on speed and zero labour; a skip wins on price
  per cubic metre once you're above a ute-tray of stuff, and for anything heavy.
  Get both quotes if your job is either very small or very large — the crossover
  point surprises people.

  *No sourced price figures on this page yet — nightly research adds verified
  provider price bands.*

waste_destination: |
  Your bin leaves on a truck and the load is **weighed and sorted at a transfer
  station or landfill gate** — the same weighbridge that generates the disposal
  charge on your invoice [1].

  - **General waste** mostly goes to landfill; some facilities recover metals and
    timber first [2].
  - **Green waste** is usually composted or mulched rather than landfilled, and is
    cheaper to dispose of — which is why green-waste bins are cheaper to hire [1].
  - **Concrete, brick, soil** go to construction-and-demolition recyclers where
    available; clean loads avoid contamination fees.
  - **Contaminated loads** (general waste mixed into a green-waste bin, or hazardous
    items anywhere) attract surcharges or rejection at the gate.

  **Cost lever:** separating green waste and heavy inert material before pickup is
  the single biggest way to avoid gate-fee surprises.

  ### Source register
  1. [Queensland waste levy — Business Queensland](https://www.business.qld.gov.au/running-business/environment/waste-management/waste-levy)
  2. [Queensland waste management facilities — open data](https://www.data.qld.gov.au/dataset/waste-management-facilities)

delivery_speed: |
  Most providers in a metro area like Brisbane can deliver **next-day**, and many
  offer **same-day** if you book before late morning [1]. Things that slow it down:

  - **Permits.** If the bin goes on the street and needs council approval, add
    processing days — Brisbane permits are handled before placement [2].
  - **Peak seasons.** Storm cleanups and pre-Christmas weeks compress availability.
  - **Access constraints.** Narrow driveways, overhead wires, slopes and unlevel
    ground can rule out delivery spots and force a rearrangement.
  - **Size availability.** Less common sizes (10m³+) may be back-ordered locally.

  **Practical order:** if you need it fast, book a driveway placement for a common
  size, morning of the previous day, and confirm the delivery window when paying.

  ### Source register
  1. [Skip bin waste types and hiring basics](/research/skip-vs-junk-removal.html)
  2. [Brisbane City Council skip bin permits](https://www.brisbane.qld.gov.au/planning-and-building/building-and-renovating/skip-bins)

which_bin_basics: |
  Brisbane-area households juggle up to three wheelie bins — and the rules genuinely
  change when you cross a council border. 1 in 4 Australians report finding the
  recycling system confusing [1].

  ### The three bins (typical SEQ setup)

  - **General waste (red or dark lid):** landfill-bound. Soft plastics, nappies,
    polystyrene, broken ceramics — the stuff no processor wants.
  - **Recycling (yellow lid):** containers and paper/cardboard. Empty, loose
    (not bagged), and clean-ish. Bagged recycling is treated as contamination.
  - **Garden organics (green lid):** lawn clippings, branches, leaves. Some SEQ
    councils are moving to **FOGO** (food organics + garden organics), which adds
    food scraps — check your council before adding food to green.

  ### The classic confusion items

  | Item | Usual answer | Why |
  |---|---|---|
  | Pizza box | Recycle if clean; grease-soaked parts to general waste | Grease contaminates paper fibre |
  | Soft plastics (bags, wrap) | General waste in most areas | Not accepted kerbside; some supermarkets take them |
  | Batteries | Never kerbside — fire risk | Drop-off points at libraries/tip shops |
  | Nappies | General waste, bagged | No processor accepts them kerbside |
  | Clothing/textiles | Donation bins first; worn-out to general waste | Kerbside recycling can't take textiles |
  | E-waste (TVs, laptops) | Never kerbside | Council drop-off events / transfer stations |

  Residents also report overflow pressure: one Sydney household's "unrecyclable"
  weekly load didn't even fit one red bin [2], and contaminated recycling gets
  whole loads dumped when too much is mixed in [3]. The fix is boring but real:
  sort at the bin, keep recycling loose and unbagged, and check your own council's
  A-Z before guessing.

  ### Source register
  1. [Guardian Australia — "bin sins": 1 in 4 find recycling confusing (15 Aug 2026)](https://www.theguardian.com/environment/2026/aug/15/bin-sins-australia-recycling-confusion)
  2. [X — @roodave, 27 Aug 2026](https://x.com/roodave)
  3. [X — @aussiewongm, 26 Aug 2026](https://x.com/aussiewongm)

missed_bin: |
  If Brisbane City Council missed your bin, the reporting window depends on the
  bin type. First check that the truck had a fair chance to service the bin, then
  use Council's official report form.

  ### What to do, in order

  1. **Check the collection day and placement.** Bins are collected every
     day of the year, including public holidays. Put bins at the kerb by 5.30am,
     at least 30cm apart, with lids closed, wheels facing your property and no
     parked-car or pathway obstruction [1].
  2. **Check common reasons for a missed collection.** Council says a bin may not
     have been collected if it exceeded the 70 kilogram weight limit, was
     obstructed, or was put out after the truck had already serviced the address [2].
  3. **Report it within the correct window.** Report a red-lid bin after 4.30pm on
     collection day. Report a yellow or green bin within 2 working days of the
     collection day. Council says missed bins will be collected as soon as possible
     [1].
  4. **Use the official action now:** [Report a bin problem online →](https://services.brisbane.qld.gov.au/online-services/report-an-issue/bin-problem)
     or phone Brisbane City Council on 07 3403 8888 [1].

  If the problem repeats, keep the report reference and note the date, bin colour
  and placement conditions. That gives Council useful detail when you follow up.

  ### Source register
  1. [Brisbane City Council — bin collections](https://www.brisbane.qld.gov.au/bins-waste-and-recycling/waste-and-recycling-bins/bin-collections)
  2. [Brisbane City Council — bin replacement, repair or collection](https://www.brisbane.qld.gov.au/bins-waste-and-recycling/waste-and-recycling-bins/bin-replacement-repair-collection)
